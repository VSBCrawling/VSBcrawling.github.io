<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSB Events</title>

  <link rel="stylesheet" href="styles.css?v=4">

  <style>
    /* Calendar container */
    .calendar-container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .month-header h2 {
      margin: 0;
      font-size: 1.8rem;
      color: #cc5500;
    }

    .nav-btn {
      background: #ff9900;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
    }

    th {
      background: #ff9900;
      color: white;
      padding: 10px;
    }

    td {
      border: 1px solid #ddd;
      height: 90px;
      vertical-align: top;
      padding: 5px;
      position: relative;
      cursor: pointer;
    }

    td.blocked {
      background: #ffe0cc;
      cursor: not-allowed;
    }

    td:hover:not(.blocked) {
      background: #fff7e6;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      bottom: 5px;
      left: 5px;
      background: #cc5500;
      color: white;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    /* Popup modal */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .popup-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      max-width: 400px;
      text-align: center;
    }

    .close-btn {
      background: #cc0000;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }

    .book-btn {
      background: #ff9900;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
    }

    /* Announcement Banner */
    .vsb-announcement {
      position: relative;
      margin: 40px auto;
      padding: 30px;
      max-width: 900px;
      background: linear-gradient(135deg, #ffefba, #ffffff);
      border: 3px solid #ff9900;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
      animation: pulseGlow 3s infinite ease-in-out;
      overflow: hidden;
    }

    .vsb-announcement h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #cc5500;
      font-weight: 700;
    }

    .vsb-announcement p {
      font-size: 1.3rem;
      color: #444;
      font-weight: 600;
    }

    /* Spotlight effect */
    .vsb-announcement.spotlight::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.35) 0%,
        rgba(255, 255, 255, 0) 60%
      );
      transform: rotate(0deg);
      animation: spotlightSweep 12s infinite linear;
      pointer-events: none;
    }

    @keyframes spotlightSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
      50% { box-shadow: 0 0 30px rgba(255, 153, 0, 0.6); }
      100% { box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
    }
  </style>
</head>

<body>

  <header>
    <img src="vsb-logo.png" alt="VSB Logo" class="logo">
    <h1>VSB Events</h1>
  </header>

  <div class="calendar-container">
    <div class="month-header">
      <button class="nav-btn" onclick="prevMonth()">Prev</button>
      <h2 id="monthYear"></h2>
      <button class="nav-btn" onclick="nextMonth()">Next</button>
    </div>

    <table id="calendar">
      <thead>
        <tr>
          <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
          <th>Thu</th><th>Fri</th><th>Sat</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Spotlight Announcement -->
  <div class="vsb-announcement spotlight">
    <div class="vsb-announcement-content">
      <h2>🎪 Come See Us at Warrington in September!</h2>
      <p>⭐ Details Coming Soon — Get Ready! ⭐</p>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <h3 id="popupTitle"></h3>
      <p id="popupDesc"></p>
      <button class="book-btn" onclick="bookEvent()">Book This Date</button>
      <button class="close-btn" onclick="closePopup()">Close</button>
    </div>
  </div>

  <script src="events.js?v=4"></script>

</body>
</html>
