      padding: 25px;
      background: var(--dark-blue);
      color: white;
      border-bottom: 6px solid var(--light-blue);
    }

      background: var(--mid-blue);
      padding: 12px;
      text-align: center;
      border-bottom: 4px solid var(--sand);
    }

    nav a {
      color: white;
      margin: 0 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    nav a:hover {
      color: var(--sand);
    }

      padding: 30px;

      border-left: 6px solid var(--light-blue);
    }

    .section h2 {
      margin-top: 0;
      color: var(--mid-blue);
    }
