<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | VSB Entertainment</title>

  <style>
    :root {
      --dark-blue: #0a2a43;
      --mid-blue: #0f4c75;
      --light-blue: #3282b8;
      --sand: #d9c29c;
      --white: #f5f5f5;
      --grit: #222;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--grit);
    }

    header {
      text-align: center;
      padding: 25px;
      background: var(--dark-blue);
      color: white;
      border-bottom: 6px solid var(--light-blue);
    }

    header img {
      width: 180px;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      color: var(--mid-blue);
      margin-top: 40px;
    }

    /* GRID */
    .gallery-grid {
      max-width: 1100px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 10px;
    }

    .gallery-grid img,
    .gallery-grid video,
    .video-frame {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .gallery-grid img:hover,
    .gallery-grid video:hover,
    .video-frame:hover {
      transform: scale(1.03);
    }

    /* FACEBOOK VIDEO WRAPPER */
    .video-frame {
      overflow: hidden;
      background: #000;
      height: 380px;
      position: relative;
    }

    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
  </style>
</head>

<script>
  // Lightbox for images
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  document.querySelectorAll('.gallery-grid img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightbox.style.display = 'flex';
    });
  });

  lightbox.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });
</script>
