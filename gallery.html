<head>
  <meta charset="UTF-8" />

  <title>Gallery | VSB Entertainment</title>

  <style>
    :root {
      --dark-blue: #0a2a43;
      --mid-blue: #0f4c75;
      --light-blue: #3282b8;
      --sand: #d9c29c;
      --white: #f5f5f5;
      --grit: #222;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--grit);
    }

    header {
      text-align: center;
      padding: 25px;
      background: var(--dark-blue);
      color: white;
      border-bottom: 6px solid var(--light-blue);
    }

    nav {
      background: var(--mid-blue);
      padding: 12px;
      text-align: center;
      border-bottom: 4px solid var(--sand);
    }

    nav a {
      color: white;
      margin: 0 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    nav a:hover {
      color: var(--sand);
    }

    .section {
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      border-left: 6px solid var(--light-blue);
    }

    .section h2 {
      margin-top: 0;
      color: var(--mid-blue);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    footer {
      background: var(--dark-blue);
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 50px;
      border-top: 4px solid var(--light-blue);
    }
  </style>
</head>
