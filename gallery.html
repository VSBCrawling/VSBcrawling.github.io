  <style>
    :root {
      --dark-blue: #0a2a43;
      --mid-blue: #0f4c75;
      --light-blue: #3282b8;
      --sand: #d9c29c;
      --white: #f5f5f5;
      --grit: #222;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--grit);
    }

    header {
      text-align: center;
      padding: 25px;
      background: var(--dark-blue);
      color: white;
      border-bottom: 6px solid var(--light-blue);
    }

    header img {
      width: 180px;
      margin-bottom: 10px;
    }

    /* NAVIGATION */
    nav {
      background: var(--mid-blue);
      padding: 12px;
      text-align: center;
      border-bottom: 4px solid var(--sand);
    }

    nav a {
      color: white;
      margin: 0 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      transition: 0.3s;
    }

    nav a:hover {
      color: var(--sand);
    }

    h2 {
      text-align: center;
      color: var(--mid-blue);
      margin-top: 40px;
    }

    /* GRID */
    .gallery-grid {
      max-width: 1100px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 10px;
    }

    .gallery-grid img,
    .gallery-grid video,
    .video-frame {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .gallery-grid img:hover,
    .gallery-grid video:hover,
    .video-frame:hover {
      transform: scale(1.03);
    }

    /* FACEBOOK VIDEO WRAPPER */
    .video-frame {
      overflow: hidden;
      background: #000;
      height: 380px;
      position: relative;
    }

    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }


    .floating-book {
      position: fixed; bottom: 25px; right: 25px; background: var(--light-blue); color: white;
      padding: 16px 26px; font-size: 20px; font-weight: bold; border-radius: 50px; text-decoration: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.3); border: 3px solid var(--mid-blue); z-index: 9999;
    }
    .floating-book:hover { background: var(--mid-blue); }

    .section {
      max-width: 1100px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15); border-left: 6px solid var(--light-blue);
    }
    footer {
      background: var(--dark-blue); color: white; text-align: center; padding: 20px;
      margin-top: 50px; border-top: 4px solid var(--light-blue);
    }
    /* Mobile + shared fixes */
    *, *::before, *::after { box-sizing: border-box; }
    img { max-width: 100%; height: auto; }
    .cta-btn {
      display: inline-block; background: #ff9900; color: #fff; padding: 14px 28px;
      font-size: 20px; font-weight: bold; border-radius: 10px; text-decoration: none;
    }
    .cta-btn:hover { background: #e68a00; }
    @media (max-width: 600px) {
      header { padding: 14px 12px; }
      header img { width: 110px !important; height: auto; margin-bottom: 4px; }
      header h1 { font-size: 26px; margin: 6px 0; }
      nav { padding: 8px 4px; display: flex; flex-wrap: wrap; justify-content: center; }
      nav a { margin: 4px 10px; font-size: 16px; }
      .hero { padding: 48px 16px !important; }
      .hero h1 { font-size: 32px !important; }
      .hero p { font-size: 18px !important; }
      .section { margin: 20px 12px !important; padding: 20px 16px !important; }
      .stats { flex-wrap: wrap; gap: 16px; }
      .floating-book { bottom: 14px !important; right: 14px !important; padding: 12px 18px !important; font-size: 17px !important; }
      .calendar td { height: 52px !important; padding: 4px !important; font-size: 14px !important; }
      .calendar th { padding: 6px 2px !important; font-size: 13px !important; }
      .banner-cta { font-size: 17px !important; padding: 14px 12px !important; }
      .vsb-announcement { margin: 20px 12px !important; padding: 20px 14px !important; }
      .vsb-announcement h2 { font-size: 1.5rem !important; }
      .vsb-announcement p { font-size: 1.05rem !important; }
      .booking-container { margin: 12px !important; padding: 18px !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

<script>
  // Lightbox for images
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  document.querySelectorAll('.gallery-grid img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightbox.style.display = 'flex';
    });
  });

  lightbox.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });
</script>
