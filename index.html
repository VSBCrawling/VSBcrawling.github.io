    /* --- COLOR PALETTE --- */
    :root {
      --dark-blue: #0a2a43;
      --mid-blue: #0f4c75;
      --light-blue: #3282b8;
      --sand: #d9c29c;
      --grit: #222;
      --white: #f5f5f5;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--grit);
    }

    /* --- HEADER --- */
    header {
      text-align: center;
      padding: 25px;
      background: var(--dark-blue);
      color: white;
      border-bottom: 6px solid var(--light-blue);
    }

    header img {
      height: 160px;
      margin-bottom: 10px;
    }

    /* --- NAVIGATION --- */
    nav {
      background: var(--mid-blue);
      padding: 12px;
      text-align: center;
      border-bottom: 4px solid var(--sand);
    }

    nav a {
      color: white;
      margin: 0 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    nav a:hover {
      color: var(--sand);
    }

    /* --- HERO SECTION --- */
    .hero {
      background: linear-gradient(
        to right,
        var(--dark-blue),
        var(--mid-blue),
        var(--light-blue)
      );

      font-size: 22px;
      letter-spacing: 1px;
    }
