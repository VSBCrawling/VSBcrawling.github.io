<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Success | VSB Entertainment</title>

  <style>
    :root {
      --dark-blue: #0a2a43;
      --mid-blue: #0f4c75;
      --light-blue: #3282b8;
      --white: #f5f5f5;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--white);
      text-align: center;
      padding: 60px 20px;
      color: var(--dark-blue);
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
      border-left: 6px solid var(--light-blue);
    }

    h1 {
      color: var(--mid-blue);
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    a {
      display: inline-block;
      background: var(--light-blue);
      color: white;
      padding: 14px 26px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      border: 3px solid var(--mid-blue);
      transition: background 0.2s, transform 0.2s;
    }

    a:hover {
      background: var(--mid-blue);
      transform: scale(1.05);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" />
  <link rel="stylesheet" href="fun.css" />
</head>

<body>

<div class="box">
  <h1>Woohoo! You’re on the List! 🎉</h1>
  <p>Your booking request has been successfully submitted.  
     We’ll reach out shortly to confirm your event details.</p>

  <a href="index.html">Return to Home</a>
</div>

</body>
</html>
