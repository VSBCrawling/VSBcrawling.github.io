<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Event | VSB</title>

  <link rel="stylesheet" href="styles.css?v=4">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fafafa;
    }

    header {
      text-align: center;
      padding: 20px 0;
      background: #0a2a43;
      color: white;
      border-bottom: 6px solid #3282b8;
    }

    .logo {
      height: 90px;
      margin-bottom: 10px;
    }

    nav {
      background: #0f4c75;
      padding: 12px;
      text-align: center;
      border-bottom: 4px solid #d9c29c;
    }

    nav a {
      color: white;
      margin: 0 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    nav a:hover {
      color: #d9c29c;
    }

    h1 {
      color: #ffffff;
      margin-top: 0;
    }

    .booking-container {
      max-width: 900px;
      margin: 20px auto;
      padding: 25px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    textarea {
      height: 120px;
    }

    .submit-btn {
      margin-top: 25px;
      background: #ff9900;
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .submit-btn:hover {
      background: #e68a00;
    }

    /* Spotlight Announcement */
    .vsb-announcement {
      position: relative;
      margin: 40px auto;
      padding: 30px;
      max-width: 900px;
      background: linear-gradient(135deg, #ffefba, #ffffff);
      border: 3px solid #ff9900;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
      animation: pulseGlow 3s infinite ease-in-out;
      overflow: hidden;
    }

    .vsb-announcement h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #cc5500;
      font-weight: 700;
    }

    .vsb-announcement p {
      font-size: 1.3rem;
      color: #444;
      font-weight: 600;
    }

    .vsb-announcement.spotlight::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.35) 0%,
        rgba(255, 255, 255, 0) 60%
      );
      transform: rotate(0deg);
      animation: spotlightSweep 12s infinite linear;
      pointer-events: none;
    }

    @keyframes spotlightSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
      50% { box-shadow: 0 0 30px rgba(255, 153, 0, 0.6); }
      100% { box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
    }
  </style>
</head>

<body>

  <header>
    <img src="FullLogo_NoBuffer (2).jpg" alt="VSB Logo" class="logo">
    <h1>Book an Event</h1>
  </header>

  <nav>
    <a href="index.html?v=4">Home</a>
    <a href="parties.html?v=4">Parties</a>
    <a href="camps.html?v=4">Camps</a>
    <a href="events.html?v=4">Events</a>
    <a href="gallery.html?v=4">Gallery</a>
    <a href="contact.html?v=4">Contact</a>
  </nav>

  <!-- Spotlight Banner -->
  <div class="vsb-announcement spotlight">
    <h2>🎉 Ready to Book Your VSB Experience?</h2>
    <p>Pick your date, tell us the details, and we’ll handle the rest!</p>
  </div>

  <div class="booking-container">
    <form action="success.html?v=4" method="POST">

      <label for="eventDate">Event Date</label>
      <input type="date" id="eventDate" name="eventDate" required>

      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="John Smith" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="555-555-5555" required>

      <label for="eventType">Event Type</label>
      <select id="eventType" name="eventType" required>
        <option value="">Select an option</option>
        <option>Birthday Party</option>
        <option>School Event</option>
        <option>Community Event</option>
        <option>Corporate Event</option>
        <option>Private Rental</option>
      </select>

      <label for="details">Additional Details</label>
      <textarea id="details" name="details" placeholder="Tell us anything we should know..."></textarea>

      <button type="submit" class="submit-btn">Submit Booking Request</button>
    </form>
  </div>

  <script>
    // Auto-fill date from calendar redirect
    const params = new URLSearchParams(window.location.search);
    if (params.has("date")) {
      document.getElementById("eventDate").value = params.get("date");
    }
  </script>

</body>
</html>
