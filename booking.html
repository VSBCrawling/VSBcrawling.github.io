<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Book an Event | VSB Entertainment</title>

  <style>
    body { margin:0; font-family:Arial; background:#f5f5f5; color:#222; }
    header, footer { background:#0a2a43; color:white; text-align:center; padding:20px; }
    nav { background:#0f4c75; text-align:center; padding:12px; }
    nav a { color:white; margin:0 15px; text-decoration:none; font-weight:bold; }
    nav a:hover { color:#d9c29c; }
    .section { max-width:900px; margin:40px auto; background:white; padding:30px;
               border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.15); }
    h2 { color:#0f4c75; margin-top:0; }
    input, textarea { width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #ccc; }
    button { background:#0f4c75; color:white; padding:12px 20px; border:none; border-radius:6px; font-weight:bold; }
    button:hover { background:#3282b8; }
  </style>
</head>

<body>

<header>
  <h1>Book an Event</h1>
  <p>RC Parties • Camps • Community Events</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="parties.html">Parties</a>
    <a href="camps.html">Camps</a>
    <a href="events.html">Events</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="section">
  <h2>Booking Form</h2>
  <p>Fill out the form below and we’ll contact you to confirm your event.</p>

  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <input type="text" placeholder="Event Type (Party, Camp, etc.)" required>
    <input type="text" placeholder="Event Location" required>
    <textarea placeholder="Additional Details" rows="5"></textarea>
    <button type="submit">Submit</button>
  </form>
</div>

<footer>

</footer>
