<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book an Event | VSB Entertainment</title>

  <style>
    :root {
      --dark-blue: #0a2a43;
      --mid-blue: #0f4c75;
      --light-blue: #3282b8;
      --sand: #d9c29c;
      --white: #f5f5f5;
      --grit: #222;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--grit);
    }

    header {
      text-align: center;
      padding: 25px;
      background: var(--dark-blue);
      color: white;
      border-bottom: 6px solid var(--light-blue);
    }

    header img {
      width: 180px;
      margin-bottom: 10px;
    }

    .section {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      border-left: 6px solid var(--light-blue);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: var(--light-blue);
      color: white;
      padding: 14px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      border: 3px solid var(--mid-blue);
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: var(--mid-blue);
      transform: scale(1.03);
    }
  </style>
</head>

<body>

<header>
  <img src="FullLogo_NoBuffer (2).jpeg" alt="VSB Entertainment Logo">
  <h1>Book an Event</h1>
</header>

<div class="section">
  <form action="https://formsubmit.co/vsb_crawling@yahoo.com" method="POST">

    <!-- FormSubmit settings -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="New Event Booking Request">
    <input type="hidden" name="_template" value="table">

    <label>Your Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Phone Number</label>
    <input type="text" name="phone" required>

    <label>Event Type</label>
    <select name="event_type" required>
      <option value="Birthday Party">Birthday Party</option>
      <option value="Camp Program">Camp Program</option>
      <option value="Fundraiser">Fundraiser</option>
      <option value="School Event">School Event</option>
      <option value="Community Event">Community Event</option>
      <option value="Other">Other</option>
    </select>

    <label>Requested Date</label>
    <input type="text" id="dateField" name="requested_date" placeholder="MM/DD/YYYY">

    <label>Event Location</label>
    <input type="text" name="location" required>

    <label>Additional Details</label>
    <textarea name="details" rows="5" placeholder="Tell us about your event..."></textarea>

    <button type="submit">Submit Booking Request</button>
  </form>
</div>

<script>
  // Auto-fill date from URL parameter
  const params = new URLSearchParams(window.location.search);
  const date = params.get("date");
  if (date) {
    document.getElementById("dateField").value = date;
  }
</script>

</body>
</html>
